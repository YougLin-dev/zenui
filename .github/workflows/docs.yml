name: docs

# No `paths:` filter, for the same reason as the workspace gate: a required
# status check that a path filter can skip never appears, and the pull request
# waits forever. The corpus check is cheap enough to run every time.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: check_docs.py proves every commit cited by matrix.json
      # exists and is an ancestor of HEAD, which a shallow clone cannot answer.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"
      - name: Check docs corpus
        run: python3 scripts/check_docs.py
