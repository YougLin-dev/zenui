name: workspace

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: workspace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: blacksmith-4vcpu-ubuntu-2604
    timeout-minutes: 5
    outputs:
      code_count: ${{ steps.filter.outputs.code_count }}
      # dorny/paths-filter 的 <filter> 输出是布尔值；启用 list-files 后，
      # 文件列表在 <filter>_files。
      docs: ${{ steps.filter.outputs.docs_files }}
      docs_count: ${{ steps.filter.outputs.docs_count }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # push 到 main 时用 git 比较 payload.before 与 HEAD；多取一个
          # commit，squash merge 的单提交推送无需再按 SHA 抓取。
          fetch-depth: 2

      # docs-only PR 跳过 Rust/模板/prototype 构建；代码 PR 仍跑完整矩阵。
      # 两个 filter 的 count 用作条件，docs 列表交给链接检查脚本。
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            code:
              - '**/*.rs'
              - '**/*.toml'
              - '**/*.py'
              - '**/Cargo.lock'
              - 'src/**'
              - 'tests/**'
              - 'crates/**'
              - 'templates/**'
              - 'examples/**'
              - '.github/workflows/**'
              - '.github/actions/**'
              - '.github/scripts/**'
            docs:
              - '*.md'
              - '**/*.md'
          list-files: json

  # 平台无关的格式、lint 与 Linux 侧验收。Windows 的编译与测试拆到下面
  # 的并行 job；这里只保留 Linux/macOS 两个 required leg。
  workspace:
    name: workspace (${{ matrix.os }})
    needs: changes
    runs-on: ${{ matrix.os }}
    # trybuild 为每个 fixture 再构建一次 facade 及其依赖，Linux leg 还要
    # 复制模板并构建 git scratch app，因此在原有 45 分钟上留出余量。
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-4vcpu-ubuntu-2604, blacksmith-6vcpu-macos-15]
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain
        if: needs.changes.outputs.code_count != '0'
        run: |
          cargo --version
          rustc --version --verbose
          rustup component add clippy rustfmt

      - name: Install Linux font dependencies
        if: runner.os == 'Linux' && needs.changes.outputs.code_count != '0'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libfontconfig1-dev

      - name: Cache Rust
        if: needs.changes.outputs.code_count != '0'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "."
          cache-bin: "false"
          cache-on-failure: "true"
          # PR 缓存只对当前 PR 可见；只在 main 保存，避免每个 PR 各存一份
          # 挤占仓库 10GB 上限。
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        if: needs.changes.outputs.code_count != '0'
        run: cargo fmt --all -- --check

      - name: Clippy
        if: needs.changes.outputs.code_count != '0'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        if: needs.changes.outputs.code_count != '0'
        run: cargo test --workspace --locked

      # LICENSE 文件使用规范全文；根 workspace 的包与模板声明同一 SPDX 表达式，
      # 包文档链接两份许可。
      - name: License files (Linux)
        if: runner.os == 'Linux'
        run: |
          test -s LICENSE-MIT
          test -s LICENSE-APACHE
          echo "cfc7749b96f63bd31c3c42b5c471bf756814053e847c10f3eb003417bc523d30  LICENSE-APACHE" | sha256sum -c -
          echo "6dcb1b91cbdf1a59b1762178774951ffb6c59f75761623429c5f0d3f5dca0937  LICENSE-MIT" | sha256sum -c -
          for manifest in Cargo.toml crates/*/Cargo.toml templates/minimal-app/Cargo.toml; do
            grep -q '^license = "MIT OR Apache-2.0"$' "$manifest"
          done
          for doc in README.md templates/minimal-app/README.md docs/SDK/从空目录开始.md docs/SDK/快速开始.md; do
            grep -q 'LICENSE-MIT' "$doc"
            grep -q 'LICENSE-APACHE' "$doc"
          done

      # docs-only PR 的轻量检查：只校验本次改动的 Markdown 相对链接。
      # 文件列表可能来自 fork PR，经 env 传入而不是拼进脚本。
      - name: Docs links (Linux)
        if: runner.os == 'Linux' && needs.changes.outputs.docs_count != '0'
        env:
          DOCS: ${{ needs.changes.outputs.docs }}
        run: python3 .github/scripts/check_docs_links.py "$DOCS"

      # 模板是「从空目录开始」的起点：复制到 checkout 之外，只把两个 path
      # 依赖指向 checkout，再构建/测试。Linux leg 复用根 workspace 的 target，
      # 不重复一次冷构建；Windows 的模板构建在独立的 Windows job 中执行。
      - name: Template copy-out (Linux)
        if: runner.os == 'Linux' && needs.changes.outputs.code_count != '0'
        run: |
          set -euo pipefail
          copy="$RUNNER_TEMP/minimal-app-outside"
          rm -rf "$copy"
          cp -R templates/minimal-app "$copy"
          rm -rf "$copy/target"
          python3 --version
          python3 - "$copy/Cargo.toml" "$GITHUB_WORKSPACE" <<'PY'
          import pathlib
          import sys

          manifest = pathlib.Path(sys.argv[1])
          root = sys.argv[2]
          text = manifest.read_text()
          replacements = {
              'zenui = { path = "../.." }': f'zenui = {{ path = "{root}" }}',
              'zenui-windows = { path = "../../crates/windows" }': (
                  f'zenui-windows = {{ path = "{root}/crates/windows" }}'
              ),
          }
          for old, new in replacements.items():
              if old not in text:
                  sys.exit(f"missing template dependency: {old}")
              text = text.replace(old, new, 1)
          manifest.write_text(text)
          PY
          grep -F "path = \"$GITHUB_WORKSPACE\"" "$copy/Cargo.toml"
          grep -F "path = \"$GITHUB_WORKSPACE/crates/windows\"" "$copy/Cargo.toml"
          cd "$copy"
          cargo test --workspace --locked

      # Cargo 的 git 依赖必须解析到具体修订：commit SHA、branch、tag 都可以，
      # `rev = "HEAD"` 不是有效的 revspec。临时 branch/tag 建在 checkout 上，
      # scratch app 用文件 URL 分别构建；HEAD 必须明确失败。
      - name: Git dependency resolution (Linux)
        if: runner.os == 'Linux' && needs.changes.outputs.code_count != '0'
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          sha="$(git -C "$root" rev-parse HEAD)"
          git -C "$root" branch -f zenui-onboarding-branch "$sha"
          git -C "$root" tag -f zenui-onboarding-tag "$sha"
          app="$RUNNER_TEMP/zenui-git-app"
          head_app="$RUNNER_TEMP/zenui-head-app"
          for dir in "$app" "$head_app"; do
            rm -rf "$dir"
            mkdir -p "$dir/src"
            cp "$root/rust-toolchain.toml" "$dir/"
            cat > "$dir/src/main.rs" <<'RS'
          fn main() {
              let _ = zenui::Runtime::new();
          }
          RS
          done
          write_manifest() {
              local dir="$1"
              local key="$2"
              local value="$3"
              cat > "$dir/Cargo.toml" <<EOF
          [package]
          name = "zenui-git-app"
          version = "0.1.0"
          edition = "2024"
          publish = false

          [dependencies]
          zenui = { git = "file://$root", $key = "$value" }
          zenui-windows = { git = "file://$root", $key = "$value" }

          [profile.dev.package."*"]
          opt-level = 3

          [profile.dev.package.zenui-render]
          opt-level = 2
          EOF
          }
          for spec in "rev=$sha" "branch=zenui-onboarding-branch" "tag=zenui-onboarding-tag"; do
              write_manifest "$app" "${spec%%=*}" "${spec#*=}"
              (cd "$app" && cargo build)
          done
          write_manifest "$head_app" rev HEAD
          if (cd "$head_app" && cargo build > "$RUNNER_TEMP/rev-head.log" 2>&1); then
              echo "rev = HEAD unexpectedly resolved"
              exit 1
          fi
          grep -F "revspec 'HEAD' not found" "$RUNNER_TEMP/rev-head.log"

  # Windows 的串行 leg 拆成并行 job：编译/lint/release 不需要适配器，
  # 放到 Blacksmith；只有隐藏窗口 + surface 的 WARP 测试留在 windows-latest。
  # 拆分后各 job 不再共享 target，模板的冷编译变长，但它们都在并行分支上，
  # 临界路径仍是 windows-test。
  windows-lint:
    name: windows-lint (blacksmith-4vcpu-windows-2025)
    needs: changes
    if: needs.changes.outputs.code_count != '0'
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      # CI 不需要本地调试符号；关闭 debuginfo 可缩短编译/链接并缩小缓存。
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain
        run: |
          cargo --version
          rustc --version --verbose
          rustup component add clippy rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # 与 windows-template-lint 共用同一份 check 缓存；只有本 job 保存。
          shared-key: windows-lint
          workspaces: "."
          cache-bin: "false"
          cache-on-failure: "true"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  windows-test:
    name: windows-test (windows-latest)
    needs: changes
    if: needs.changes.outputs.code_count != '0'
    # 隐藏 host 请求与窗口 surface 兼容的 DX12 适配器；Blacksmith Windows
    # 上该请求返回 NoAdapter（见 host.rs 与 ADR-0005），所以测试留在这里。
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain
        run: |
          cargo --version
          rustc --version --verbose
          rustup component add clippy rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # 与 windows-template-test 共用同一份 dev/test 缓存；只有本 job 保存。
          shared-key: windows-test
          workspaces: "."
          cache-bin: "false"
          cache-on-failure: "true"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # compile-fail 套件只依赖公开 API，不依赖 Windows；Linux/macOS leg
      # 仍完整运行 trybuild，这里跳过约 95 秒的嵌套构建。
      - name: Test
        run: cargo test --workspace --locked -- --skip public_macro_inputs_compile_or_emit_expected_diagnostics

  windows-template-lint:
    name: windows-template-lint (blacksmith-4vcpu-windows-2025)
    needs: changes
    if: needs.changes.outputs.code_count != '0'
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain
        run: |
          cargo --version
          rustc --version --verbose
          rustup component add clippy rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows-lint
          workspaces: "."
          cache-bin: "false"
          save-if: "false"

      - name: Template format
        run: cargo fmt --manifest-path templates/minimal-app/Cargo.toml --all -- --check

      - name: Template clippy
        run: cargo clippy --manifest-path templates/minimal-app/Cargo.toml --workspace --all-targets --locked -- -D warnings

  windows-template-test:
    name: windows-template-test (windows-latest)
    needs: changes
    if: needs.changes.outputs.code_count != '0'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain
        run: |
          cargo --version
          rustc --version --verbose
          rustup component add clippy rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: windows-test
          workspaces: "."
          cache-bin: "false"
          save-if: "false"

      - name: Template test (drift + headless + hidden host)
        run: cargo test --manifest-path templates/minimal-app/Cargo.toml --workspace --locked

  # release 构建必须留下 GUI 子系统的 exe：双击时不附带控制台。
  # release profile 与 dev/test 不共享产物，单独放在并行 job 不损失复用。
  windows-template-release:
    name: windows-template-release (blacksmith-4vcpu-windows-2025)
    needs: changes
    if: needs.changes.outputs.code_count != '0'
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 20
    env:
      CARGO_TERM_COLOR: always
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain
        run: |
          cargo --version
          rustc --version --verbose

      - name: Template release build
        shell: pwsh
        run: |
          cargo build --manifest-path templates/minimal-app/Cargo.toml --release --locked
          $exe = Join-Path $env:CARGO_TARGET_DIR 'release\minimal-app.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "missing release exe: $exe" }
          $bytes = [IO.File]::ReadAllBytes($exe)
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $subsystem = [BitConverter]::ToUInt16($bytes, $pe + 0x5C)
          if ($subsystem -ne 2) { throw "release exe subsystem $subsystem, expected Windows GUI (2)" }
          Write-Output "release exe: $exe (subsystem $subsystem)"

  # 保持 branch protection 里的 required context 名字不变；这个 gate 只有
  # 在所有 Windows job 成功或被跳过时才通过。
  windows:
    name: workspace (windows-latest)
    needs: [changes, windows-lint, windows-test, windows-template-lint, windows-template-test, windows-template-release]
    if: always()
    runs-on: blacksmith-4vcpu-ubuntu-2604
    timeout-minutes: 5
    steps:
      - name: Verify the Windows jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          results = json.loads(os.environ["RESULTS"])
          failed = {
              name: job["result"]
              for name, job in results.items()
              if job["result"] not in ("success", "skipped")
          }
          if failed:
              raise SystemExit(f"Windows jobs did not succeed: {failed}")
          print("Windows jobs succeeded or were skipped")
          PY

  prototypes:
    name: prototypes (${{ matrix.os }} / ${{ matrix.example }})
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-4vcpu-ubuntu-2604, blacksmith-6vcpu-macos-15, blacksmith-4vcpu-windows-2025]
        example:
          - examples/macro_poc
          - examples/native_poc
          - examples/desktop_poc
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain
        if: needs.changes.outputs.code_count != '0'
        run: |
          cargo --version
          rustc --version --verbose
          rustup component add clippy rustfmt

      - name: Install Linux font dependencies
        if: runner.os == 'Linux' && matrix.example == 'examples/native_poc' && needs.changes.outputs.code_count != '0'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libfontconfig1-dev

      - name: Format
        if: needs.changes.outputs.code_count != '0'
        run: cargo fmt --manifest-path ${{ matrix.example }}/Cargo.toml --all -- --check
      - name: Clippy
        if: needs.changes.outputs.code_count != '0'
        run: cargo clippy --manifest-path ${{ matrix.example }}/Cargo.toml --workspace --all-targets --locked -- -D warnings

      - name: Test
        if: needs.changes.outputs.code_count != '0'
        run: cargo test --manifest-path ${{ matrix.example }}/Cargo.toml --workspace --locked
