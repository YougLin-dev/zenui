name: workspace

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: workspace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: workspace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # trybuild 为每个 fixture 再构建一次 facade 及其依赖；Windows leg 还要
    # 冷编译模板的 release 依赖，Linux leg 还要复制模板并构建 git scratch
    # app，因此在原有 45 分钟上留出余量。
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # 宿主测试按窗口 surface（DirectComposition 交换链）请求 DX12 适配器。
        # Blacksmith Windows runner 上 D3D12/WARP 可用（无 surface 的 GPU
        # 测试通过），但与窗口 surface 兼容的适配器请求失败（NoAdapter），
        # 因此这一 leg 保留在 GitHub 托管的 windows-latest。
        os: [blacksmith-4vcpu-ubuntu-2604, blacksmith-6vcpu-macos-15, windows-latest]
    env:
      CARGO_TERM_COLOR: always
      # 模板是独立 workspace，但 Windows leg 与根 workspace 共享 target，
      # 避免为同一批依赖再编译一次。
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain
        run: |
          cargo --version
          rustc --version --verbose
          rustup component add clippy rustfmt

      - name: Install Linux font dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libfontconfig1-dev

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      # LICENSE 文件使用规范全文；根 workspace 的包与模板声明同一 SPDX 表达式，
      # 包文档链接两份许可。
      - name: License files (Linux)
        if: runner.os == 'Linux'
        run: |
          test -s LICENSE-MIT
          test -s LICENSE-APACHE
          echo "cfc7749b96f63bd31c3c42b5c471bf756814053e847c10f3eb003417bc523d30  LICENSE-APACHE" | sha256sum -c -
          echo "6dcb1b91cbdf1a59b1762178774951ffb6c59f75761623429c5f0d3f5dca0937  LICENSE-MIT" | sha256sum -c -
          for manifest in Cargo.toml crates/*/Cargo.toml templates/minimal-app/Cargo.toml; do
            grep -q '^license = "MIT OR Apache-2.0"$' "$manifest"
          done
          for doc in README.md templates/minimal-app/README.md docs/SDK/从空目录开始.md docs/SDK/快速开始.md; do
            grep -q 'LICENSE-MIT' "$doc"
            grep -q 'LICENSE-APACHE' "$doc"
          done

      # 模板是「从空目录开始」的起点：复制到 checkout 之外，只把两个 path
      # 依赖指向 checkout，再构建/测试。Linux leg 复用根 workspace 的 target，
      # 不重复一次冷构建；Windows 的模板构建仍在下面原地执行。
      - name: Template copy-out (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          copy="$RUNNER_TEMP/minimal-app-outside"
          rm -rf "$copy"
          cp -R templates/minimal-app "$copy"
          rm -rf "$copy/target"
          python3 --version
          python3 - "$copy/Cargo.toml" "$GITHUB_WORKSPACE" <<'PY'
          import pathlib
          import sys

          manifest = pathlib.Path(sys.argv[1])
          root = sys.argv[2]
          text = manifest.read_text()
          replacements = {
              'zenui = { path = "../.." }': f'zenui = {{ path = "{root}" }}',
              'zenui-windows = { path = "../../crates/windows" }': (
                  f'zenui-windows = {{ path = "{root}/crates/windows" }}'
              ),
          }
          for old, new in replacements.items():
              if old not in text:
                  sys.exit(f"missing template dependency: {old}")
              text = text.replace(old, new, 1)
          manifest.write_text(text)
          PY
          grep -F "path = \"$GITHUB_WORKSPACE\"" "$copy/Cargo.toml"
          grep -F "path = \"$GITHUB_WORKSPACE/crates/windows\"" "$copy/Cargo.toml"
          cd "$copy"
          cargo test --workspace --locked

      # Cargo 的 git 依赖必须解析到具体修订：commit SHA、branch、tag 都可以，
      # `rev = "HEAD"` 不是有效的 revspec。临时 branch/tag 建在 checkout 上，
      # scratch app 用文件 URL 分别构建；HEAD 必须明确失败。
      - name: Git dependency resolution (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          root="$GITHUB_WORKSPACE"
          sha="$(git -C "$root" rev-parse HEAD)"
          git -C "$root" branch -f zenui-onboarding-branch "$sha"
          git -C "$root" tag -f zenui-onboarding-tag "$sha"
          app="$RUNNER_TEMP/zenui-git-app"
          head_app="$RUNNER_TEMP/zenui-head-app"
          for dir in "$app" "$head_app"; do
            rm -rf "$dir"
            mkdir -p "$dir/src"
            cp "$root/rust-toolchain.toml" "$dir/"
            cat > "$dir/src/main.rs" <<'RS'
          fn main() {
              let _ = zenui::Runtime::new();
          }
          RS
          done
          write_manifest() {
              local dir="$1"
              local key="$2"
              local value="$3"
              cat > "$dir/Cargo.toml" <<EOF
          [package]
          name = "zenui-git-app"
          version = "0.1.0"
          edition = "2024"
          publish = false

          [dependencies]
          zenui = { git = "file://$root", $key = "$value" }
          zenui-windows = { git = "file://$root", $key = "$value" }

          [profile.dev.package."*"]
          opt-level = 3

          [profile.dev.package.zenui-render]
          opt-level = 2
          EOF
          }
          for spec in "rev=$sha" "branch=zenui-onboarding-branch" "tag=zenui-onboarding-tag"; do
              write_manifest "$app" "${spec%%=*}" "${spec#*=}"
              (cd "$app" && cargo build)
          done
          write_manifest "$head_app" rev HEAD
          if (cd "$head_app" && cargo build > "$RUNNER_TEMP/rev-head.log" 2>&1); then
              echo "rev = HEAD unexpectedly resolved"
              exit 1
          fi
          grep -F "revspec 'HEAD' not found" "$RUNNER_TEMP/rev-head.log"

      # 模板有自己的 workspace、Cargo.lock 与工具链；隐藏 smoke 是 partial
      # evidence（宿主在没有硬件适配器时回退 WARP），可见窗口验收仍需在
      # Windows 11 实机执行。
      - name: Template format
        if: runner.os == 'Windows'
        run: cargo fmt --manifest-path templates/minimal-app/Cargo.toml --all -- --check

      - name: Template clippy
        if: runner.os == 'Windows'
        run: cargo clippy --manifest-path templates/minimal-app/Cargo.toml --workspace --all-targets --locked -- -D warnings

      - name: Template test (drift + headless + hidden host)
        if: runner.os == 'Windows'
        run: cargo test --manifest-path templates/minimal-app/Cargo.toml --workspace --locked

      # release 构建必须留下 GUI 子系统的 exe：双击时不附带控制台。
      - name: Template release build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --manifest-path templates/minimal-app/Cargo.toml --release --locked
          $exe = Join-Path $env:CARGO_TARGET_DIR 'release\minimal-app.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw "missing release exe: $exe" }
          $bytes = [IO.File]::ReadAllBytes($exe)
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $subsystem = [BitConverter]::ToUInt16($bytes, $pe + 0x5C)
          if ($subsystem -ne 2) { throw "release exe subsystem $subsystem, expected Windows GUI (2)" }
          Write-Output "release exe: $exe (subsystem $subsystem)"

  prototypes:
    name: prototypes (${{ matrix.os }} / ${{ matrix.example }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-4vcpu-ubuntu-2604, blacksmith-6vcpu-macos-15, blacksmith-4vcpu-windows-2025]
        example:
          - examples/macro_poc
          - examples/native_poc
          - examples/desktop_poc
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain
        run: |
          cargo --version
          rustc --version --verbose
          rustup component add clippy rustfmt

      - name: Install Linux font dependencies
        if: runner.os == 'Linux' && matrix.example == 'examples/native_poc'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libfontconfig1-dev

      - name: Format
        run: cargo fmt --manifest-path ${{ matrix.example }}/Cargo.toml --all -- --check
      - name: Clippy
        run: cargo clippy --manifest-path ${{ matrix.example }}/Cargo.toml --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --manifest-path ${{ matrix.example }}/Cargo.toml --workspace --locked
