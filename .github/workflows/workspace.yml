name: workspace

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: workspace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workspace:
    name: workspace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # trybuild 为每个 fixture 再构建一次 facade 及其依赖；Windows leg 还要
    # 冷编译模板的 release 依赖，因此在原有 45 分钟上留出余量。
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-4vcpu-ubuntu-2604, blacksmith-6vcpu-macos-15, blacksmith-4vcpu-windows-2025]
    env:
      CARGO_TERM_COLOR: always
      # 模板是独立 workspace，但 Windows leg 与根 workspace 共享 target，
      # 避免为同一批依赖再编译一次。
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain
        run: |
          cargo --version
          rustc --version --verbose
          rustup component add clippy rustfmt

      - name: Install Linux font dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libfontconfig1-dev

      # Blacksmith 的 Windows 镜像没有可用的 WARP 适配器，宿主测试会报
      # NoAdapter。把 NuGet 版 WARP 放到测试可执行文件旁，D3D12 会优先加载它。
      - name: Install WARP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-Item "$env:SystemRoot\System32\d3d12.dll", "$env:SystemRoot\System32\d3d10warp.dll" -ErrorAction SilentlyContinue |
            ForEach-Object { "$($_.FullName) $($_.VersionInfo.FileVersion)" }
          $zip = Join-Path $env:RUNNER_TEMP warp.zip
          $dir = Join-Path $env:RUNNER_TEMP warp
          Invoke-WebRequest https://www.nuget.org/api/v2/package/Microsoft.Direct3D.WARP/1.0.22 -OutFile $zip
          Expand-Archive $zip -DestinationPath $dir -Force
          $deps = Join-Path $env:CARGO_TARGET_DIR debug\deps
          New-Item -ItemType Directory -Force -Path $deps | Out-Null
          Copy-Item "$dir\build\native\bin\x64\d3d10warp.dll" $deps

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

      # 模板有自己的 workspace、Cargo.lock 与工具链；隐藏 WARP smoke 是
      # partial evidence，可见窗口验收仍需在 Windows 11 实机执行。
      - name: Template format
        if: runner.os == 'Windows'
        run: cargo fmt --manifest-path templates/minimal-app/Cargo.toml --all -- --check

      - name: Template clippy
        if: runner.os == 'Windows'
        run: cargo clippy --manifest-path templates/minimal-app/Cargo.toml --workspace --all-targets --locked -- -D warnings

      - name: Template test (drift + headless + hidden WARP)
        if: runner.os == 'Windows'
        run: cargo test --manifest-path templates/minimal-app/Cargo.toml --workspace --locked

      - name: Template release build
        if: runner.os == 'Windows'
        run: cargo build --manifest-path templates/minimal-app/Cargo.toml --release --locked

  prototypes:
    name: prototypes (${{ matrix.os }} / ${{ matrix.example }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-4vcpu-ubuntu-2604, blacksmith-6vcpu-macos-15, blacksmith-4vcpu-windows-2025]
        example:
          - examples/macro_poc
          - examples/native_poc
          - examples/desktop_poc
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain
        run: |
          cargo --version
          rustc --version --verbose
          rustup component add clippy rustfmt

      - name: Install Linux font dependencies
        if: runner.os == 'Linux' && matrix.example == 'examples/native_poc'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes libfontconfig1-dev

      - name: Format
        run: cargo fmt --manifest-path ${{ matrix.example }}/Cargo.toml --all -- --check
      - name: Clippy
        run: cargo clippy --manifest-path ${{ matrix.example }}/Cargo.toml --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --manifest-path ${{ matrix.example }}/Cargo.toml --workspace --locked
