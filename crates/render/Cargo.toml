[package]
name = "zenui-render"
version = "0.1.0"
edition = "2024"
publish = false
description = "Platform-neutral Taffy/Parley scene construction for ZenUI presentation snapshots"
license = "MIT OR Apache-2.0"

[dependencies]
glifo = "=0.5.0"
parley = { version = "=0.13.0", features = ["complex-scripts"] }
pollster = "=0.4.0"
taffy = "=0.15.1"
vello_gpu = "=0.4.0"
wgpu = "=30.0.2"
zenui = { path = "../.." }
zenui-style = { path = "../style" }

[dev-dependencies]
# 分词 spike：版本必须与 parley 的 `icu_segmenter ~2.3.0` / `icu_provider 2.3.0`
# 要求兼容，否则 `DictionaryProvider` 的 blanket 实现不再匹配。
icu_provider = { version = "2.3.0", default-features = false }
icu_segmenter = { version = "~2.3.0", default-features = false, features = ["compiled_data"] }
zenui-demo = { path = "../demo" }
