[package]
name = "zenui-render"
version = "0.1.0"
edition = "2024"
publish = false
description = "Platform-neutral Taffy/Parley scene construction for ZenUI presentation snapshots"
license = "MIT OR Apache-2.0"

[dependencies]
glifo = "=0.5.0"
parley = { version = "=0.13.0", features = ["complex-scripts"] }
pollster = "=0.4.0"
taffy = "=0.15.1"
vello_gpu = "=0.4.0"
wgpu = "=30.0.2"
zenui = { path = "../.." }

[dev-dependencies]
zenui-demo = { path = "../demo" }
