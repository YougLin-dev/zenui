[package]
name = "zenui-windows"
version = "0.1.0"
edition = "2024"
publish = false
description = "Win32 host with a DX12 surface for ZenUI presentation snapshots"
license = "MIT OR Apache-2.0"

[target.'cfg(windows)'.dependencies]
pollster = "=0.4.0"
wgpu = "=30.0.2"
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
zenui = { path = "../.." }
zenui-render = { path = "../render" }
