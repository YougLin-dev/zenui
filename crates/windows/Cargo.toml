[package]
name = "zenui-windows"
version = "0.1.0"
edition = "2024"
publish = false
description = "Win32 host with a DX12 surface for ZenUI presentation snapshots"
license = "MIT OR Apache-2.0"

[dependencies]
# 文本资产类型跨平台转发；模板在非 Windows 上也要能加载并校验资产。
zenui-render = { path = "../render" }

[target.'cfg(windows)'.dependencies]
pollster = "=0.4.0"
wgpu = "=30.0.2"
# `#[implement]` 展开为 `::windows_core::*` 绝对路径，必须直接依赖且版本一致。
windows-core = "=0.62.2"
# 一次声明后续平台工单需要的 API 面：OLE/拖放（含 IDataObject/STGMEDIUM）、
# UIA（含 Variant）、剪贴板、菜单与托盘。只加 feature，不改变当前行为。
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
zenui = { path = "../.." }

[dev-dependencies]
zenui-demo = { path = "../demo" }
