[workspace]
members = ["crates/core", "crates/app", "crates/macro"]
resolver = "3"

[package]
name = "zenui"
version = "0.1.0"
edition = "2024"
autoexamples = false
publish = false

[dependencies]
zenui-core = { path = "crates/core" }
zenui-macro = { path = "crates/macro" }

[[example]]
name = "minimal_todo"
path = "examples/minimal_todo.rs"
