[workspace]
members = [
    "crates/core",
    "crates/app",
    "crates/macro",
    "crates/style",
    "crates/render",
    "crates/windows",
    "crates/demo",
    "crates/perf",
]
resolver = "3"

# 开发构建只优化依赖：布局、文本整形与 GPU 栈在未优化时慢一个数量级，
# 拖拽 resize 会明显卡顿；本地 crate 仍保持快速增量编译。
[profile.dev.package."*"]
opt-level = 3

# 场景 builder、文本缓存与绘制入口也在热路径上。完整 opt-level 3 会拖慢
# 增量编译，2 足以让 500 行列表在 debug 构建中保持可交互。
[profile.dev.package.zenui-render]
opt-level = 2

[package]
name = "zenui"
version = "0.1.0"
edition = "2024"
autoexamples = false
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
zenui-core = { path = "crates/core" }
zenui-macro = { path = "crates/macro" }
zenui-style = { path = "crates/style" }

[dev-dependencies]
zenui-demo = { path = "crates/demo" }
trybuild = "1.0"

[[example]]
name = "minimal_todo"
path = "examples/minimal_todo.rs"

[[example]]
name = "presentation_snapshot"
path = "examples/presentation_snapshot.rs"
