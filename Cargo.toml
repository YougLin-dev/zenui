[workspace]
members = [
    "crates/core",
    "crates/app",
    "crates/macro",
    "crates/render",
    "crates/windows",
    "crates/demo",
]
resolver = "3"

# 开发构建只优化依赖：布局、文本整形与 GPU 栈在未优化时慢一个数量级，
# 拖拽 resize 会明显卡顿；本地 crate 仍保持快速增量编译。
[profile.dev.package."*"]
opt-level = 3

[package]
name = "zenui"
version = "0.1.0"
edition = "2024"
autoexamples = false
publish = false

[dependencies]
zenui-core = { path = "crates/core" }
zenui-macro = { path = "crates/macro" }

[dev-dependencies]
zenui-demo = { path = "crates/demo" }
trybuild = "1.0"

[[example]]
name = "minimal_todo"
path = "examples/minimal_todo.rs"

[[example]]
name = "presentation_snapshot"
path = "examples/presentation_snapshot.rs"
